,"rivalCash":0,"damage":0,"prevented":0,"excess":0,"island":0,"expectedCash":35,"synergy":null},{"turn":226,"round":60,"seat":3,"card":2,"target":-1,"cash":50,"rivalCash":0,"damage":0,"prevented":0,"excess":0,"island":0,"expectedCash":0,"synergy":null},{"turn":226,"round":60,"seat":3,"card":0,"target":2,"cash":348,"rivalCash":-348,"damage":0,"prevented":0,"excess":0,"island":0,"expectedCash":null,"synergy":null}]}];
const names=["절약 계약","정기 수입","위험 투자","견제 사격","보호막"];
const $=id=>document.getElementById(id);
const name=id=>names[id]||"기준 선택";
const percent=(wins,count)=>count?(100*wins/count).toFixed(1)+"%":"—";
let subset=[],playback;
function fill(target,rows){
  target.replaceChildren(...rows.map(row=>{
    const tr=document.createElement("tr");
    for(const value of row){const cell=tr.insertCell();cell.textContent=value;}
    return tr;
  }));
}
function refresh(){
  stop();
  subset=games.filter(g=>["map","noise"].every(k=>$(k).value===""||g[k]===Number($(k).value)));
  const accepted=p=>!$("profile").value||p.profile===$("profile").value;
  const free=subset.filter(g=>g.forced===-2);
  const baseline=new Map(subset.filter(g=>g.forced===-1).map(g=>[g.seed,g]));
  fill($("cards"),names.map((label,id)=>{
    let offers=0,picks=0,owners=0,wins=0,cash=0,damage=0,prevented=0,islands=0,delta=0,pairs=0;
    for(const g of free){
      const seats=g.seats.filter(accepted);
      for(const p of seats){
        for(const c of g.choices.filter(c=>c.seat===p.seat&&"card" in c)){offers+=c.offers.filter(x=>x===id).length;picks+=Number(c.card===id);}
        if(!p.cards.includes(id))continue;
        owners++;wins+=Number(p.place===1);
        for(const e of g.events.filter(e=>e.seat===p.seat&&e.card===id)){
          cash+=e.cash;damage+=e.damage;prevented+=e.prevented;islands+=e.island;
        }
      }
    }
    for(const g of subset.filter(g=>g.forced===id)){
      const base=baseline.get(g.seed);
      if(!base||!accepted(g.seats.find(p=>p.seat===g.subject)))continue;
      pairs++;delta+=Number(g.winner===g.subject)-Number(base.winner===base.subject);
    }
    const avg=n=>owners?(n/owners).toFixed(1):"—";
    const diff=pairs?`${delta>=0?"+":""}${(100*delta/pairs).toFixed(1)}%p (n=${pairs}${pairs<30?", 소표본":""})`:"—";
    return [label,offers,picks,owners,avg(cash),avg(damage)+" / "+avg(prevented),islands,percent(wins,owners),diff];
  }));
  $("summary").textContent=`자유 선택 ${free.length}판 · 비교 실험 ${subset.length-free.length}판 · 4인 AI`;
  $("match").replaceChildren(...subset.map((g,i)=>new Option(`시드 ${g.seed} · ${g.forced===-2?"자유 선택":name(g.forced)} · ${g.turns}턴`,i)));
  selectMatch();
}
function stop(){clearInterval(playback);$("play").textContent="20배속 효과 보기";playback=null;}
function selectMatch(){stop();const g=subset[Number($("match").value)];$("turn").max=g?.turns||1;$("turn").value=1;showTurn();}
function showTurn(){
  const g=subset[Number($("match").value)];
  if(!g){$("details").textContent="경기 데이터 없음";fill($("effects"),[]);return;}
  const t=Number($("turn").value);
  const picks=g.choices.filter(c=>c.turn<=t).map(c=>"card" in c
      ? `${c.draft+1}단계 · P${c.seat+1} · ${c.offers.map((id,i)=>name(id)+" "+c.scores[i].toFixed(1)).join(" / ")} → ${name(c.card)}`
      : `${c.draft+1}단계 · P${c.seat+1} · ${c.golden?"황금 리롤":"리롤"} · ${name(c.before[c.reroll])} → ${name(c.replacement)}`);
  const chosen=$("effect-card").value;
  const seen=g.events.filter(e=>e.turn<=t&&(chosen===""||e.card===Number(chosen)));
  const seats=g.seats.map(p=>{
    const effects=seen.filter(e=>e.seat===p.seat);
    const total=key=>effects.reduce((sum,e)=>sum+e[key],0);
    return `P${p.seat+1} ${p.profile} · 효과 ${total("cash")}G · 피해 ${total("damage")} · 방어 ${total("prevented")}`;
  });
  $("details").textContent=`${t} / ${g.turns}턴 · 최종 1위 P${g.winner+1} · 시드 ${g.seed}, 맵 ${g.map}, 노이즈 ${g.noise}, 좌석 회전 ${g.rotation}, 지급 ${g.forced}\n`
      +seats.join("\n")+"\n"+picks.join("\n");
  fill($("effects"),seen.slice(-16).reverse().map(e=>[
    `${e.turn}턴 P${e.seat+1}${e.target<0?"":" → P"+(e.target+1)}`,name(e.card),e.cash,e.rivalCash,e.damage,e.prevented,e.excess,e.island,e.expectedCash??"—",e.synergy??"—"
  ]));
}
for(const id of ["map","noise","profile"])$(id).onchange=refresh;
$("match").onchange=selectMatch;
$("turn").oninput=showTurn;
$("effect-card").onchange=showTurn;
$("play").onclick=()=>{
  if(playback){stop();return;}
  if($("turn").value===$("turn").max)$("turn").value=1;
  $("play").textContent="일시정지";
  playback=setInterval(()=>{if(Number($("turn").value)>=Number($("turn").max)){stop();return;} $("turn").value=Number($("turn").value)+1;showTurn();},50);
};
refresh();
</script>
